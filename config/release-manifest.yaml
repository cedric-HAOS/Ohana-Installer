schema_version: 1

platform:
  name: Ohana
  version: "1.0.17"

runtime:
  python:
    minimum_version: "3.13"

components:
  agent:
    name: Ohana-Agent
    repository: cedric-HAOS/Ohana-Agent
    version: "1.8.1"
    release_tag: v1.8.1

    package:
      type: wheel
      filename: ohana_agent-1.8.1-py3-none-any.whl

    configuration:
      directory: /etc/ohana-agent
      files:
        - source: shikamaru.example.yaml
          destination: shikamaru.yaml

        - source: infrastructure.example.yaml
          destination: infrastructure.yaml

        - source: dns.example.yaml
          destination: plugins/dns.yaml

        - source: ntp.example.yaml
          destination: plugins/ntp.yaml

        - source: mqtt.example.yaml
          destination: plugins/mqtt.yaml

        - source: network.example.yaml
          destination: plugins/network.yaml

        - source: dhcp.example.yaml
          destination: plugins/dhcp.yaml

        - source: wireguard.example.yaml
          destination: plugins/wireguard.yaml

        - source: shelly-telemetry.example.yaml
          destination: plugins/shelly-telemetry.yaml

        - source: teleinformation.example.yaml
          destination: plugins/teleinformation.yaml

        - source: zwave.example.yaml
          destination: plugins/zwave.yaml

    service:
      filename: ohana-agent.service
      description: Ohana Agent
      user: ohana-agent
      group: ohana-agent
      working_directory: /opt/ohana-agent
      executable: /opt/ohana-agent/venv/bin/ohana-agent
      arguments:
        - --config
        - /etc/ohana-agent/shikamaru.yaml
        - --infrastructure
        - /etc/ohana-agent/infrastructure.yaml
        - --dns-config
        - /etc/ohana-agent/plugins/dns.yaml
        - --ntp-config
        - /etc/ohana-agent/plugins/ntp.yaml
        - --mqtt-config
        - /etc/ohana-agent/plugins/mqtt.yaml
        - --network-config
        - /etc/ohana-agent/plugins/network.yaml
        - --dhcp-config
        - /etc/ohana-agent/plugins/dhcp.yaml
        - --shelly-telemetry-config
        - /etc/ohana-agent/plugins/shelly-telemetry.yaml
        - --teleinformation-config
        - /etc/ohana-agent/plugins/teleinformation.yaml
        - --wireguard-config
        - /etc/ohana-agent/plugins/wireguard.yaml
        - --zwave-config
        - /etc/ohana-agent/plugins/zwave.yaml

  vision:
    name: Ohana-Vision
    repository: cedric-HAOS/Ohana-Vision
    version: "1.7.0"
    release_tag: v1.7.0

    package:
      type: wheel
      filename: ohana_vision-1.7.0-py3-none-any.whl

    configuration:
      directory: /etc/ohana-vision
      files:
        - source: vision.example.yaml
          destination: vision.yaml

    service:
      filename: ohana-vision.service
      description: Ohana Vision
      user: ohana-vision
      group: ohana-vision
      working_directory: /opt/ohana-vision
      executable: /opt/ohana-vision/venv/bin/ohana-vision
      arguments:
        - --config
        - /etc/ohana-vision/vision.yaml

compatibility:
  operating_system:
    family: Linux
    service_manager: systemd
