name: CI

on:
  push:
    branches: ["**"]
    tags-ignore: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Ruff
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Installer ruff
        run: python -m pip install "ruff~=0.16.0"

      - name: ruff check
        run: ruff check --output-format=github .

      - name: ruff format --check
        run: ruff format --check --diff .

  tests:
    name: Pytest (Python 3.13, Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Installer le projet et ses dépendances de développement
        run: python -m pip install -e ".[dev]"

      - name: pytest
        run: python -m pytest -q -ra

      - name: Vérifier le moteur AdGuard épinglé sur Linux
        run: |
          python - <<'PY'
          import subprocess
          import tempfile
          from pathlib import Path
          from ohana_installer.adguard_sync import ensure_binary, installed_version, VERSION
          with tempfile.TemporaryDirectory(prefix="ohana-adguard-smoke-") as directory:
              binary = Path(directory) / "adguardhome-sync"
              ensure_binary(binary)
              assert installed_version(binary) == VERSION
              result = subprocess.run([str(binary), "run", "--help"],
                                      capture_output=True, text=True, timeout=10, check=True)
              for option in ("--cron", "--api-port", "--runOnStart"):
                  assert option in result.stdout, option
          print("Pinned engine and systemd command options verified")
          PY

  commits:
    name: Messages de commit
    uses: cedric-HAOS/Ohana-Platform/.github/workflows/commit-messages.yml@main
